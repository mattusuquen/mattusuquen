name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # daily at ~06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate animated contribution graph
        run: python scripts/generate_streak_svg.py mattusuquen contrib-heatmap.svg

      - name: Commit refreshed graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: contrib-heatmap.svg
